<!doctype html><html><head><meta charset="utf-8"><title>Arcade completion playtest</title><style>body{margin:0;background:#100b10;color:#ffe7b9;font:12px Arial}iframe{position:fixed;inset:0;border:0;width:100%;height:100%}nav{position:fixed;top:0;left:35%;z-index:10;background:#1b1220;padding:4px;display:flex;gap:4px}button{background:#3f3030;color:#ffe7b9;padding:6px;border:1px solid #987950}output{position:fixed;bottom:0;left:0;z-index:10;background:#100b10;max-width:70vw}</style></head><body><iframe id="game" src="../index.html"></iframe><nav><button data-game="pinball">Pinball</button><button data-game="pop">Potato Pop</button><button data-game="stack">Stack</button><button data-game="vault">Vault</button><button data-game="train">Train</button><button id="chips">Place chips</button><button id="entities">Entities</button><button id="audit">Audit</button></nav><output id="report">Waiting for game</output><script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('output');let started=false;
const L=()=>frame.contentWindow.__lastCall;
const fixture=document.createElement('button');fixture.textContent='Pop target fixture';document.querySelector('nav').append(fixture);fixture.onclick=()=>{const l=L(),r=l.state.arcade.pop;if(!r)return;for(const p of r.holes)p.on=false;r.phase='play';r.time=60;r.next=60;r.holes[4]={id:4,on:true,bad:false,until:r.elapsed+60,up:r.elapsed-.2};l.step(.02);l.render();const p=l.screenPoint(.5,.58);out.textContent=JSON.stringify({fixture:'pop',x:p.x,y:p.y,score:r.score});frame.focus();};
const narrow=document.createElement('button');narrow.textContent='Narrow / Wide';document.querySelector('nav').append(narrow);narrow.onclick=()=>{frame.style.width=frame.style.width?'':'740px';out.textContent='Viewport '+frame.clientWidth;};
setInterval(()=>{if(!started&&L()?.S.ready)out.textContent='Ready · Select a game';},500);
for(const b of document.querySelectorAll('[data-game]'))b.onclick=()=>{
 const l=L();if(!l?.S.ready)return;
 if(!started){l.noLock();l.start('gambler',{players:6});started=true;l.step(.1);l.state.target=1e12;for(const c of l.state.chars){c.isHuman=true;if(c.id){c.x=1300;c.y=400+c.id*40;}}}
 l.act('leave');l.step(.02);const s=l.state.seats.find(s=>s.game===b.dataset.game);s.occ=s.claim=null;l.place(s.x,s.y);l.look(s.face,['pinball','pop'].includes(s.game)?-.5:0);l.render();l.render();out.textContent='At '+s.game;frame.focus();
};
document.querySelector('#chips').onclick=()=>{const l=L();l.press('spot:main');l.render();out.textContent='Chips staged · Use Space to start, Space again to launch';frame.focus();};
document.querySelector('#entities').onclick=()=>{const l=L();l.start('gambler',{players:6,mode:'escape'});started=true;l.step(.1);const s=l.state;s.target=1e12;for(const c of s.chars)c.isHuman=true;l.place(1300,900);l.look(0,0);s.survival.entities=['bacteria','skinstealer','hound','smiler'].map((kind,i)=>({id:90+i,kind,x:1500,y:750+i*100,face:Math.PI,moving:false,alert:false,path:[],speed:0,repath:1e9}));l.render();out.textContent='Four generated Backrooms entities';frame.focus();};
document.querySelector('#audit').onclick=()=>{const l=L(),d=frame.contentDocument,r=l.view.pub.arcade[l.view.priv.seat?.game],scene=l.scene().scene;out.textContent=JSON.stringify({game:l.view.priv.seat?.game,focus:d.body.classList.contains('machineFocused'),score:r?.score,phase:r?.phase,left:r?.left,right:r?.right,position:[l.S.me.x,l.S.me.y],paddles:!!scene.getObjectByName('pinball-left-flipper'),potatoes:scene.getObjectByName('potato-pop-playfield')?.children.filter(o=>o.name.startsWith('pop-potato')).map(o=>({name:o.name,y:o.position.y,visible:o.visible})),help:d.querySelector('#machineHelp')?.textContent});frame.focus();};
</script></body></html>
