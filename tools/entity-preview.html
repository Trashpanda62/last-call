<!doctype html><html><head><meta charset="utf-8"><title>Generated Backrooms creature review</title><style>body{margin:0;background:#22201a;color:#ffe4ae;font:14px Arial}nav{position:fixed;top:12px;left:12px;z-index:2;display:flex;gap:8px}button{padding:10px;background:#29251c;color:#ffe4ae;border:1px solid #967e53;border-radius:4px}canvas{display:block}output{position:fixed;bottom:12px;left:12px}</style><script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/addons/"}}</script></head><body><nav><button data-kind="bacteria">Bacteria</button><button data-kind="skinstealer">Skin-Stealer</button><button data-kind="hound">Hound</button><button data-kind="smiler">Smiler</button><button id="motion">Walk / Run / Idle</button><button id="side">Rotate</button></nav><output>Loading generated creatures</output><script type="module">
import * as THREE from 'three';import{preloadBackroomsEntities,BackroomsEntities}from '../src/3d/backrooms-entities.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#36352e');const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.02,40);camera.position.set(0,1.3,4.8);camera.lookAt(0,1.2,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd8e6ff,0x3c2b15,2));const light=new THREE.DirectionalLight(0xffdfba,3);light.position.set(-3,5,4);scene.add(light);const rim=new THREE.DirectionalLight(0x8aa9bd,2);rim.position.set(3,2,-3);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x474335,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);
await preloadBackroomsEntities();let actor,kind,mode=0;const entities=new BackroomsEntities(scene),out=document.querySelector('output');
function show(k){if(actor)scene.remove(actor.g);actor=entities.make(k);kind=k;scene.add(actor.g);out.textContent=k+' · generated textured mesh · '+(mode===0?'idle':mode===1?'walk':'run');}
for(const b of document.querySelectorAll('[data-kind]'))b.onclick=()=>show(b.dataset.kind);
document.querySelector('#motion').onclick=()=>{mode=(mode+1)%3;out.textContent=kind+' · '+['idle','walk','run'][mode];};document.querySelector('#side').onclick=()=>actor.g.rotation.y+=Math.PI/2;
show('bacteria');let last=performance.now();function draw(now){const dt=Math.min(.1,(now-last)/1000);last=now;actor?.updateGenerated?.(dt,{moving:mode>0,alert:mode===2});renderer.render(scene,camera);requestAnimationFrame(draw);}requestAnimationFrame(draw);
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};
</script></body></html>
