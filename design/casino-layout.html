<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Last Call — top-down floor plan</title><style>
:root{color-scheme:dark;font:16px/1.5 Arial,sans-serif;color:#eee9dd;background:#101918}*{box-sizing:border-box}body{margin:0}header{padding:24px 32px 16px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid #35473d}h1{font-size:28px;letter-spacing:-.025em;line-height:1.1;margin:0 0 8px}p{margin:0;color:#b3c5bc}nav{display:flex;gap:8px}button,a{font:inherit;color:inherit}button{padding:10px 18px;border:1px solid #647268;background:#21302a;border-radius:6px;cursor:pointer;min-height:44px;white-space:nowrap}button[aria-pressed=true]{background:#f0d498;color:#101918;border-color:#f0d498}button:focus-visible,a:focus-visible{outline:3px solid #f0d498;outline-offset:4px}main{max-width:1800px;margin:auto;padding:16px 24px}#plan svg{width:100%;height:auto;display:block}.map-object{cursor:pointer}.map-object:hover rect,.map-object:focus rect{stroke:#fff;stroke-width:8;outline:none}aside{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:16px 24px;background:#1c2a24;border:1px solid #35473d;border-radius:6px}aside p{font-size:14px}a{color:#f0d498}#selection{color:#eee9dd}@media(max-width:750px){header{display:block;padding:20px}nav{margin-top:16px}main{padding:8px}aside{display:block}aside a{display:inline-block;margin-top:12px}h1{font-size:24px}}
</style></head><body><header><div><h1>A floor plan with a clear order.</h1><p>One derby pedestal. Games grouped by room. Entrances kept clear.</p></div><nav aria-label="Compare layouts"><button data-mode="updated" aria-pressed="true">Updated layout</button><button data-mode="before" aria-pressed="false">Before</button></nav></header><main><div id="plan"></div><aside><div><strong id="selection">Select a fixture to inspect its footprint.</strong><p id="detail">The updated drawing uses actual game coordinates. North is up; walls and door openings stay in place.</p></div><a href="./casino-layout-top-down.svg" download>Download top-down SVG</a></aside></main><script type="module">
import {renderPlan} from './casino-plan.mjs';
const [updated,before]=await Promise.all(['./casino-layout-built.json','./casino-layout-before-2026-10-17.json'].map(p=>fetch(p).then(r=>r.json())));
let mode='updated';const plan=document.getElementById('plan');
function draw(){const prior=mode==='before';plan.innerHTML=renderPlan(prior?{...before,walls:updated.walls,doorGaps:updated.doorGaps}:updated,{before:prior});for(const o of plan.querySelectorAll('[data-name]')){const show=()=>{document.getElementById('selection').textContent=o.dataset.name;document.getElementById('detail').textContent=o.dataset.detail;};o.onclick=show;o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show();}};}}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;for(const q of document.querySelectorAll('[data-mode]'))q.setAttribute('aria-pressed',String(q===b));document.getElementById('selection').textContent=mode==='before'?'Previous placement':'Updated placement';document.getElementById('detail').textContent='Same room shell and door openings. Select any fixture for measurements.';draw();};draw();
</script></body></html>
